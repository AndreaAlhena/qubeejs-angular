name: Deploy docs site to GitHub Pages

on:
  # Production deploy on every push to master
  push:
    branches: [master]
    # Skip if the push touched nothing the site is built from: its own sources,
    # the library source the API pages are generated from, or the changelog
    paths:
      - 'docs/**'
      - 'src/**'
      - 'router/**'
      - 'http/**'
      - 'CHANGELOG.md'
      - 'tsconfig*.json'
      - '.github/workflows/docs.yml'

  # Allow re-running manually from the Actions tab
  workflow_dispatch:

# GitHub Pages requires these permissions on the workflow that uploads
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue concurrent deploys; cancel any in-progress run when a newer
# push lands so we never deploy a stale build
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install root dependencies
        # TypeDoc resolves @angular/* and @qubeejs/core from the root
        # node_modules when it generates the API pages
        run: npm ci

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro site
        # Generates the API pages and the changelog, builds, and fails on a
        # broken internal link (starlight-links-validator)
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
