name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --browsers=ChromeHeadless --watch=false --code-coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage/qubeejs-angular/lcov.info
          flags: unittests
          name: qubeejs-angular-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Check build artifacts
        run: |
          if [ ! -d "dist/qubeejs/angular" ]; then
            echo "Build failed: dist/qubeejs/angular directory not found"
            exit 1
          fi
          echo "Build successful: dist/qubeejs/angular directory exists"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/qubeejs/angular
          retention-days: 7

  compat:
    name: Angular ${{ matrix.angular }} compat
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor of the declared peer range
          - angular: '17'
            node: '20'
          - angular: '20'
            node: '22'
          # Current stable major
          - angular: '22'
            node: '24'
          # Angular's next prerelease — early warning for the coming major, never blocks the build
          - angular: 'next'
            node: '24'
            experimental: true

    env:
      NG_CLI_ANALYTICS: 'false'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: qubeejs-angular-dist

      - name: Pack the built library
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: qubeejs-angular-dist

      - name: Scaffold an Angular ${{ matrix.angular }} application
        run: |
          npx --yes @angular/cli@${{ matrix.angular }} new consumer \
            --routing=false --style=css --ssr=false --skip-git --defaults \
            --package-manager=npm

      - name: Install the packed library
        run: npm install "$GITHUB_WORKSPACE"/qubeejs-angular-*.tgz
        working-directory: consumer

      - name: Consume the library for real
        run: |
          cat > src/main.ts <<'TS'
          import { Component, inject } from '@angular/core';
          import { bootstrapApplication } from '@angular/platform-browser';
          import { provideRouter } from '@angular/router';
          import {
            QubeeQueryBuilder,
            SPATIE_DRIVER,
            defineList,
            injectQubeeList,
            integerParam,
            provideQubee
          } from '@qubeejs/angular';
          import { provideQubeeRouterAdapter } from '@qubeejs/angular/router';

          const userList = defineList({
            params: { page: integerParam('page', { default: 1, min: 1 }) },
            qubee: { driver: SPATIE_DRIVER },
            resource: 'users'
          });

          @Component({
            selector: 'app-root',
            standalone: true,
            template: `
              <pre>{{ qb.uri() }}</pre>
              <pre>{{ list.request().uri }}</pre>
              <button (click)="list.setPage(2)">2</button>
            `
          })
          export class AppRoot {
            protected readonly qb = inject(QubeeQueryBuilder);
            protected readonly list = injectQubeeList(userList);

            constructor() {
              this.qb
                .setResource('users')
                .addFilter('status', 'active')
                .setLimit(15)
                .setPage(2);
            }
          }

          bootstrapApplication(AppRoot, {
            providers: [
              provideQubee({ driver: SPATIE_DRIVER }),
              provideRouter([]),
              provideQubeeRouterAdapter()
            ]
          });
          TS
        working-directory: consumer

      - name: Build the consumer application
        run: npx ng build
        working-directory: consumer

      - name: Verify the library was linked and not tree-shaken
        run: |
          BUNDLE=$(find dist -name '*.js' -print0 | xargs -0 grep -l 'spatie' 2>/dev/null | head -1 || true)
          if [ -z "$BUNDLE" ]; then
            echo "@qubeejs/angular was tree-shaken out — the build proved nothing"
            exit 1
          fi
          echo "Library code present in $BUNDLE"

          if ! grep -rq 'found no adapter' dist; then
            echo "injectQubeeList was tree-shaken out — the lists API was not exercised"
            exit 1
          fi
          echo "Lists API and the router entry point present"

          if grep -rq 'ngDeclare' dist; then
            echo "Residual partial declarations found — the Angular ${{ matrix.angular }} linker did not process them"
            exit 1
          fi
          echo "All partial declarations linked by Angular ${{ matrix.angular }}"
        working-directory: consumer

  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, build, compat]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.compat.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed successfully!"
