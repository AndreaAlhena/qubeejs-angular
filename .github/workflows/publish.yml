name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted-publisher OIDC auth
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify the release tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Run tests
        run: npm test -- --browsers=ChromeHeadless --watch=false

      - name: Build library
        run: npm run build

      - name: Publish to npm
        working-directory: dist/qubeejs/angular
        run: npm publish --provenance --access public
